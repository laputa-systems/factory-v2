[workspace]
members = [
    "crates/society-kernel",
    "crates/society-pi",
    "crates/societyctl",
    "crates/societyd",
    "crates/society-content",
    "crates/society-product",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
blake3 = "=1.8.5"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
miniserde = "=0.1.46"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["migrate"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["migrate"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["net", "rt", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
