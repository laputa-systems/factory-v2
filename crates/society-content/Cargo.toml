[package]
name = "society-content"
version = "0.1.0"
edition = "2024"
license = "MIT"

# This crate remains isolated until its physical seal receipt has a matching
# durable kernel command. Root workspace admission is a later integration step.
[workspace]

[dependencies]
libc = "=0.2.177"
sha2 = "=0.11.0"
thiserror = "=2.0.20"

[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
