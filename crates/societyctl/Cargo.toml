[package]
name = "societyctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
society-kernel = { path = "../society-kernel" }
societyd = { path = "../societyd" }
thiserror.workspace = true

[[test]]
name = "resident_protocol"
path = "../../tests/daemon/resident_protocol.rs"

# This Unix client needs a few documented descriptor operations. It cannot
# inherit the workspace-wide unsafe-code denial, but every unsafe block remains
# subject to Clippy's mandatory safety-comment judge.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
