[package]
name = "societyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Narrow, compile-time-only process fault seams. This feature is never enabled
# by the daemon binary or public control protocol; provider-free integration
# tests opt in to prove post-spawn containment without ambient environment
# switches.
test-support = []

[dependencies]
libc.workspace = true
society-kernel = { path = "../society-kernel" }
society-pi = { path = "../society-pi" }
society-content = { path = "../society-content" }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Process and signal physics require a narrow set of documented libc calls.
# This crate cannot inherit the workspace-wide unsafe-code denial, but every
# unsafe block remains subject to Clippy's mandatory safety-comment judge.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
