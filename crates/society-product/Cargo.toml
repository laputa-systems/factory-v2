[package]
name = "society-product"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Provider-free guarded Git product materialization primitives for XSH Society V2"

# This crate is intentionally its own temporary workspace.  The root workspace
# is integrated by the owning tranche only after this narrow Git boundary has
# passed its isolated contract tests.
[workspace]

[dependencies]
sha2 = "=0.11.0"
thiserror = "=2.0.20"

# Product materialization is trusted process and filesystem physics.  These
# lints make the narrow safety posture visible even before root integration.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
